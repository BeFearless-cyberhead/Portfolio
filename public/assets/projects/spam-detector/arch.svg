<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
     
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5a6375"/>
    </marker>
  </defs>
     <rect width="800" height="450" rx="10" fill="#f7f2e8"/>
     
    <text x="400" y="34" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
     font-size="17" font-weight="bold" letter-spacing="2" fill="#33414f">SPAM DETECTOR — TRAIN → CALIBRATE → SERVE</text>
    
    <g>
      <rect x="28" y="86" width="170" height="76" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="113" y="103" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2a7f76">Dataset</text>
      <text x="113" y="125.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">UCI SMS Collection</text><text x="113" y="142.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">5,574 raw messages</text>
    </g>
    
    <g>
      <rect x="258" y="86" width="200" height="76" rx="9" fill="#ffffff" stroke="#b98a1f" stroke-width="2"/>
      <text x="358" y="104" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#b98a1f">Validate</text>
      <text x="358" y="128" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#212a33">dedupe · stratified split</text><text x="358" y="146" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#212a33">abort on label conflict</text>
    </g>
    
    <g>
      <rect x="518" y="86" width="250" height="76" rx="9" fill="#ffffff" stroke="#c24331" stroke-width="2"/>
      <text x="643" y="102.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#c24331">TF-IDF → CLF → Calibrate</text>
      <text x="643" y="124.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">word + char n-grams (30k feats)</text><text x="643" y="140.75" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">class-balanced LogisticRegression</text><text x="643" y="157.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">sigmoid calibration</text>
    </g>

    
    <g>
      <rect x="380" y="208" width="250" height="70" rx="9" fill="#ffffff" stroke="#b98a1f" stroke-width="2"/>
      <text x="505" y="225" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#b98a1f">Artifacts</text>
      <text x="505" y="247.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">spam_model.joblib</text><text x="505" y="264.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">metrics.json + dataset SHA-256</text>
    </g>

    
    <g>
      <rect x="40" y="322" width="150" height="56" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="115" y="339" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2a7f76">Library API</text>
      <text x="115" y="361.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">build_model()</text>
    </g>
    
    <g>
