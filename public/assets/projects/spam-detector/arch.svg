      <text x="289" y="360.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">/predict · /batch</text><text x="289" y="376.75" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">/health · /drift</text>
    </g>
    
    <g>
      <rect x="388" y="322" width="150" height="56" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="463" y="339" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2a7f76">CLI</text>
      <text x="463" y="361.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">5 console scripts</text>
    </g>
    
    <g>
      <rect x="562" y="322" width="150" height="56" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="637" y="339" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2a7f76">Streamlit</text>
      <text x="637" y="361.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">model card sidebar</text><text x="637" y="378.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">confidence panel</text>
    </g>

