<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#1FA8A6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="#0D1B2A"/>
  <!-- User Query -->
  <rect x="40" y="160" width="120" height="60" rx="12" fill="url(#g1)"/>
  <text x="100" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">User Query</text>
  <text x="100" y="205" text-anchor="middle" fill="#fff" font-size="10" font-family="sans-serif">Natural Language</text>
  <!-- Arrow -->
  <path d="M160 190 L200 190" stroke="#0E7C7B" stroke-width="2"/>
  <!-- Query Decomposition -->
  <rect x="200" y="140" width="130" height="80" rx="12" fill="#1A2A3D" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="265" y="170" text-anchor="middle" fill="#E8C46A" font-size="11" font-weight="bold" font-family="sans-serif">Query</text>
  <text x="265" y="188" text-anchor="middle" fill="#E8C46A" font-size="11" font-weight="bold" font-family="sans-serif">Decomposition</text>
  <text x="265" y="210" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">GPT-4o-mini</text>
  <!-- Arrow -->
  <path d="M330 190 L370 190" stroke="#C9A84C" stroke-width="2"/>
  <!-- Vector Search -->
  <rect x="370" y="100" width="130" height="60" rx="12" fill="url(#g2)"/>
  <text x="435" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Pinecone</text>
  <text x="435" y="145" text-anchor="middle" fill="#fff" font-size="10" font-family="sans-serif">Vector Search Top-50</text>
  <!-- Cross Encoder -->
  <rect x="370" y="210" width="130" height="60" rx="12" fill="#1A2A3D" stroke="#6366F1" stroke-width="1.5"/>
  <text x="435" y="235" text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="bold" font-family="sans-serif">Cross-Encoder</text>
  <text x="435" y="255" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">Re-rank to Top-10</text>
  <!-- Arrows between stages -->
  <path d="M330 170 L370 130" stroke="#0E7C7B" stroke-width="1.5"/>
  <path d="M500 130 L500 180 L560 180" stroke="#6366F1" stroke-width="1.5"/>
  <path d="M500 240 L500 200 L560 200" stroke="#6366F1" stroke-width="1.5"/>
  <!-- Synthesis -->
  <rect x="560" y="155" width="120" height="70" rx="12" fill="url(#g1)"/>
  <text x="620" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Synthesise</text>
  <text x="620" y="205" text-anchor="middle" fill="#fff" font-size="10" font-family="sans-serif">GPT-4o Answer</text>
  <!-- Arrow -->
  <path d="M680 190 L720 190" stroke="#0E7C7B" stroke-width="2"/>
  <!-- Response -->
  <rect x="720" y="165" width="60" height="50" rx="8" fill="#1A2A3D" stroke="#0E7C7B" stroke-width="2"/>
  <text x="750" y="195" text-anchor="middle" fill="#1FA8A6" font-size="11" font-weight="bold" font-family="sans-serif">API</text>
  <!-- Document Store label -->
  <rect x="370" y="310" width="130" height="40" rx="8" fill="#1A2A3D" stroke="#3FCF8E" stroke-width="1.5"/>
  <text x="435" y="335" text-anchor="middle" fill="#3FCF8E" font-size="11" font-weight="bold" font-family="sans-serif">10K+ Documents</text>
  <path d="M435 310 L435 270" stroke="#3FCF8E" stroke-width="1" stroke-dasharray="4"/>
  <path d="M435 310 L435 160" stroke="#3FCF8E" stroke-width="1" stroke-dasharray="4"/>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" fill="#5A6375" font-size="11" font-family="sans-serif">RAG Pipeline — Multi-Agent Document Retrieval Architecture</text>
</svg>
