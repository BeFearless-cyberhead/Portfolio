<svg xmlns="http://www.w3.org/2004/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="400" fill="#0D1B2A" rx="12" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="monospace" font-size="20" font-weight="bold" fill="#0E7C7B" text-anchor="middle">Financial Tracker Architecture</text>
  
  <!-- Nodes -->
  <!-- Sources -->
  <rect x="50" y="100" width="120" height="60" rx="8" fill="#1A2C42" stroke="#0E7C7B" stroke-width="2" />
  <text x="110" y="135" font-family="sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Emails / SMS</text>
  
  <rect x="50" y="240" width="120" height="60" rx="8" fill="#1A2C42" stroke="#0E7C7B" stroke-width="2" />
  <text x="110" y="275" font-family="sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Bank APIs</text>
  
  <!-- Processing (LangGraph) -->
  <rect x="260" y="100" width="280" height="200" rx="12" fill="rgba(14, 124, 123, 0.1)" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8, 4" />
  <text x="400" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D4AF37" text-anchor="middle">LangGraph Pipeline</text>
  
  <rect x="290" y="150" width="220" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="400" y="175" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">NLP Parsing Node</text>
  
  <rect x="290" y="210" width="220" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="400" y="235" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">Fuzzy Deduplication Node</text>

  <rect x="290" y="270" width="220" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="400" y="295" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">AI Categorisation Node</text>
  
  <!-- Storage & UI -->
  <rect x="620" y="100" width="120" height="60" rx="8" fill="#1A2C42" stroke="#0E7C7B" stroke-width="2" />
  <text x="680" y="135" font-family="sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Supabase DB</text>

  <rect x="620" y="240" width="120" height="60" rx="8" fill="#1A2C42" stroke="#0E7C7B" stroke-width="2" />
  <text x="680" y="275" font-family="sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Dashboard UI</text>
  
  <!-- Arrows -->
  <g stroke="#0E7C7B" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <path d="M 170 130 L 250 160" />
    <path d="M 170 270 L 250 250" />
    <path d="M 400 190 L 400 210" />
    <path d="M 400 250 L 400 270" />
    <path d="M 540 200 L 620 130" />
    <path d="M 680 160 L 680 240" />
  </g>
  
  <text x="730" y="200" font-family="sans-serif" font-size="10" fill="#0E7C7B" text-anchor="middle" transform="rotate(90, 680, 200)">Real-time sync</text>

  <!-- Defs for arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0E7C7B" />
    </marker>
  </defs>
</svg>
