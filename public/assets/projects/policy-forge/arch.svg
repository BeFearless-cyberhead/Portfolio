    <path d="M 476 135 C 503 135, 503 135, 530 135" fill="none" stroke="#5a6375" stroke-width="1.8"
     marker-end="url(#ah)"/>
    <path d="M 476 265 C 503 265, 503 265, 530 265" fill="none" stroke="#5a6375" stroke-width="1.8"
    stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <path d="M 653 180 C 653 199, 653 199, 653 218" fill="none" stroke="#5a6375" stroke-width="1.8"
     marker-end="url(#ah)"/>
    <path d="M 653 310 C 653 329, 653 329, 653 348" fill="none" stroke="#2a7f76" stroke-width="1.8"
     marker-end="url(#ah)"/>
    <path d="M 545 310 C 545 329, 545 329, 545 348" fill="none" stroke="#2a7f76" stroke-width="1.8"
     marker-end="url(#ah)"/>
    <path d="M 420 383 C 397 383, 397 383, 374 383" fill="none" stroke="#5a6375" stroke-width="1.8"
    stroke-dasharray="5 4" marker-end="url(#ah)"/>
  
   </svg>