<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
     
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5a6375"/>
    </marker>
  </defs>
     <rect width="800" height="450" rx="10" fill="#f7f2e8"/>
     
    <text x="400" y="34" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
     font-size="17" font-weight="bold" letter-spacing="2" fill="#33414f">POLICYFORGE — DETERMINISTIC · LEAST-PRIVILEGE</text>
    
    <g>
      <rect x="28" y="150" width="180" height="130" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="118" y="166.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#2a7f76">Access Intent</text>
      <text x="118" y="188.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">service · actions</text><text x="118" y="204.75" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">resources</text><text x="118" y="221.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33"></text><text x="118" y="237.75" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">declared up front —</text><text x="118" y="254.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#212a33">no NLP guessing</text>
    </g>

    
    <g>
      <rect x="266" y="90" width="210" height="90" rx="9" fill="#ffffff" stroke="#b98a1f" stroke-width="2"/>
      <text x="371" y="108" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#b98a1f">Validation</text>
      <text x="371" y="132" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#212a33">schema + enums</text><text x="371" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#212a33">deny unknown fields</text>
    </g>
    
    <g>
      <rect x="266" y="220" width="210" height="90" rx="9" fill="#ffffff" stroke="#b98a1f" stroke-width="2"/>
      <text x="371" y="237" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#b98a1f">Rules Engine</text>
      <text x="371" y="259.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">allowlist of services</text><text x="371" y="276.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">per-service action map</text><text x="371" y="293.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">resource ARN patterns</text>
    </g>

    
    <g>
      <rect x="534" y="90" width="238" height="90" rx="9" fill="#ffffff" stroke="#c24331" stroke-width="2"/>
      <text x="653" y="107" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#c24331">Policy Renderer</text>
      <text x="653" y="129.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">canonical JSON, sorted keys</text><text x="653" y="146.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">actions always exact strings</text>
    </g>
    
    <g>
      <rect x="534" y="220" width="238" height="90" rx="9" fill="#ffffff" stroke="#c24331" stroke-width="2"/>
      <text x="653" y="237" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#c24331">Least-Privilege Pass</text>
      <text x="653" y="259.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">Effect: Allow · no wildcards</text><text x="653" y="276.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">ARN scope-down to the request</text>
    </g>

    
    <g>
      <rect x="120" y="352" width="250" height="62" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="245" y="370" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#2a7f76">Output</text>
      <text x="245" y="394" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#212a33">IAM JSON document</text>
    </g>
    
    <g>
      <rect x="420" y="352" width="250" height="62" rx="9" fill="#ffffff" stroke="#2a7f76" stroke-width="2"/>
      <text x="545" y="369" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2a7f76">Policy Tests</text>
      <text x="545" y="391.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#212a33">simulator runs deny-by-default</text>
    </g>

    <path d="M 208 185 C 235 185, 235 135, 262 135" fill="none" stroke="#5a6375" stroke-width="1.8"
     marker-end="url(#ah)"/>
    <path d="M 208 245 C 235 245, 235 259, 262 259" fill="none" stroke="#5a6375" stroke-width="1.8"
