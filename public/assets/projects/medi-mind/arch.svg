<svg xmlns="http://www.w3.org/2004/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="400" fill="#0D1B2A" rx="12" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="monospace" font-size="20" font-weight="bold" fill="#0E7C7B" text-anchor="middle">Medi Mind Architecture</text>
  
  <!-- Nodes -->
  <!-- Client Side -->
  <rect x="50" y="120" width="180" height="180" rx="12" fill="rgba(212, 175, 55, 0.05)" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8, 4" />
  <text x="140" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D4AF37" text-anchor="middle">Frontend App</text>
  
  <rect x="70" y="170" width="140" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="140" y="195" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">Patient Intake UI</text>

  <rect x="70" y="230" width="140" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="140" y="255" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">Admin Dashboard UI</text>

  <!-- Supabase Layer -->
  <rect x="400" y="100" width="300" height="220" rx="12" fill="rgba(14, 124, 123, 0.1)" stroke="#0E7C7B" stroke-width="2" />
  <text x="550" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0E7C7B" text-anchor="middle">Supabase Backend</text>
  
  <rect x="430" y="150" width="240" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="550" y="175" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">Auth Layer (Custom Roles)</text>

  <rect x="430" y="210" width="240" height="40" rx="6" fill="#1A2C42" stroke="#D4AF37" stroke-width="1.5" />
  <text x="550" y="235" font-family="sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle">Row Level Security (RLS)</text>

  <rect x="430" y="270" width="240" height="40" rx="6" fill="#1A2C42" stroke="#41E2BA" stroke-width="1.5" />
  <text x="550" y="295" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">PostgreSQL Database</text>

  <!-- Arrows -->
  <g stroke="#0E7C7B" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <!-- Auth request -->
    <path d="M 230 170 L 420 170" />
    <!-- Data request -->
    <path d="M 230 250 L 420 250" />
  </g>
  
  <text x="325" y="160" font-family="sans-serif" font-size="10" fill="#0E7C7B" text-anchor="middle">Login / Register</text>
  <text x="325" y="240" font-family="sans-serif" font-size="10" fill="#0E7C7B" text-anchor="middle">CRUD Operations</text>
  
  <!-- Internal Supabase Arrows -->
  <g stroke="#0E7C7B" stroke-width="1" stroke-dasharray="2, 2" fill="none" marker-end="url(#arrowhead-small)">
    <path d="M 550 190 L 550 210" />
    <path d="M 550 250 L 550 270" />
  </g>

  <!-- Defs -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0E7C7B" />
    </marker>
    <marker id="arrowhead-small" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0E7C7B" />
    </marker>
  </defs>
</svg>
